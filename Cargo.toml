[workspace]
members = ["core", "cli", "daemon", "config", "tui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Cecep Azhar <hi@cecepazhar.com>"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_toml = "0.0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
crossterm = "0.27"
ratatui = "0.26"
axum = { version = "0.7", features = [] }
sysinfo = "0.31"
